<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>1000 Bornes — ChadGang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script src="/_sdk.js"></script>
<style>
:root{--blue:#2433f2;--blue2:#1a26c9;--yel:#ffd426;--ink:#12102b;--red:#ff4545;--green:#1fbf5b;--gold:#ffb800;--paper:#fffbea}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--blue);background-image:radial-gradient(circle at 15% 10%,#3a49ff 0,transparent 40%),radial-gradient(circle at 90% 90%,#1520b8 0,transparent 45%);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-weight:800;overflow:hidden;height:100dvh;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
input{font:inherit}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.on{display:flex}
.btn{font-weight:900;border:3px solid var(--ink);border-radius:14px;background:var(--yel);color:var(--ink);padding:10px 16px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.w{background:#fff}.btn.g{background:var(--green);color:#fff}.btn.r{background:var(--red);color:#fff}.btn.k{background:var(--ink);color:var(--yel)}
.btn.sm{padding:6px 10px;border-radius:11px;box-shadow:3px 3px 0 var(--ink);font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.panel{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:16px}
h3{font-weight:900;font-size:17px;margin:14px 0 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:3px solid var(--ink);border-radius:999px;padding:5px 12px;background:#fff;cursor:pointer;font-weight:900;box-shadow:2px 2px 0 var(--ink)}
.chip.on{background:var(--yel)}
.inp{border:3px solid var(--ink);border-radius:12px;padding:9px 12px;font-weight:900;min-width:0;background:#fff;color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
small,.muted{color:#5b5980;font-weight:700}

/* HOME */
.scroll{overflow-y:auto;overflow-x:hidden;height:100%;padding:16px 16px 40px}
.home-wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.logo{text-align:center;font-family:'Bowlby One',sans-serif;line-height:.9;margin-top:6px;filter:drop-shadow(5px 5px 0 var(--ink))}
.logo .l1{display:block;font-size:clamp(70px,22vw,120px);color:var(--yel);-webkit-text-stroke:3px var(--ink);letter-spacing:2px;animation:wob 3s ease-in-out infinite}
.logo .l2{display:inline-block;font-size:clamp(34px,10vw,56px);color:#fff;-webkit-text-stroke:2px var(--ink);background:var(--red);padding:2px 14px 6px;border:3px solid var(--ink);border-radius:12px;transform:rotate(-3deg)}
@keyframes wob{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(2deg) scale(1.04)}}
.home-road{position:relative;height:44px;background:#3b3b4f;border:3px solid var(--ink);border-radius:12px;overflow:hidden;box-shadow:4px 4px 0 var(--ink)}
.home-road::before{content:'';position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;background:repeating-linear-gradient(90deg,#fff 0 22px,transparent 22px 44px);animation:roadmv .5s linear infinite}
@keyframes roadmv{to{background-position:-44px 0}}
.hcar{position:absolute;top:2px;font-size:32px;transform:scaleX(-1);animation:drive 5s cubic-bezier(.5,0,.5,1) infinite}
@keyframes drive{0%{left:-12%}100%{left:105%}}
.who{display:flex;align-items:center;gap:10px;font-size:18px}
.note{background:#fff3c4;border:2px dashed var(--ink);border-radius:12px;padding:10px;font-size:14px}

/* GAME */
#game{background:transparent}
.gtop{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--ink);color:var(--yel);border-bottom:3px solid #000;flex:none}
.gtitle{font-family:'Bowlby One';font-size:16px;white-space:nowrap}
#ginfo{display:flex;gap:6px;flex:1;min-width:0;overflow:hidden}
.pill{background:#2a2750;color:#fff;border-radius:999px;padding:2px 9px;font-size:12px;white-space:nowrap}
.gbtns{display:flex;gap:5px}
.ib{width:34px;height:34px;border-radius:10px;border:2px solid var(--yel);background:transparent;color:#fff;cursor:pointer;font-size:16px;display:grid;place-items:center}
.ib:active{transform:scale(.92)}
#opps{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;padding:8px 10px 0;max-width:1100px;width:100%;margin:0 auto;flex:none}
.opp{background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink);padding:6px 8px;position:relative;transition:transform .2s,box-shadow .2s;min-width:0}
.opp.turn{box-shadow:0 0 0 4px var(--yel),3px 3px 0 4px var(--ink);transform:translateY(-1px)}
.opp.tgt{cursor:pointer;border-color:var(--red);animation:tpulse .8s ease-in-out infinite}
@keyframes tpulse{0%,100%{box-shadow:0 0 0 3px var(--red),3px 3px 0 3px var(--ink)}50%{box-shadow:0 0 0 7px rgba(255,69,69,.55),3px 3px 0 3px var(--ink);transform:scale(1.02)}}
.oh{display:flex;align-items:center;gap:7px;min-width:0}
.av{width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);object-fit:cover;display:grid;place-items:center;color:#fff;font-weight:900;font-size:15px;flex:none;overflow:hidden;background:#888}
.nm{flex:1;min-width:0;line-height:1.05}
.nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.nm small{font-size:11px}
.ocards{font-size:12px;background:#eef;border-radius:8px;padding:1px 6px;white-space:nowrap}
.thinking{position:absolute;top:-10px;right:8px;background:var(--yel);border:2px solid var(--ink);border-radius:999px;font-size:11px;padding:0 7px;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.road{display:flex;align-items:center;gap:7px;margin:6px 0 4px}
.track{position:relative;flex:1;height:24px;background:#3b3b4f;border:2px solid var(--ink);border-radius:8px}
.track::before{content:'';position:absolute;left:4px;right:4px;top:50%;height:2px;margin-top:-1px;background:repeating-linear-gradient(90deg,#fff 0 7px,transparent 7px 14px);opacity:.55}
.track .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:6px 0 0 6px;background:linear-gradient(90deg,rgba(255,212,38,.15),rgba(255,212,38,.55));transition:width 1.1s cubic-bezier(.3,.8,.3,1)}
.track .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:rgba(255,255,255,.25)}
.car{position:absolute;top:50%;left:0;font-size:21px;line-height:1;transform:translate(-30%,-58%) scaleX(-1);transition:left 1.1s cubic-bezier(.3,.8,.3,1);z-index:2;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4))}
.flag{position:absolute;right:-6px;top:50%;transform:translateY(-62%);font-size:17px;z-index:1}
.kmtxt{font-family:'Bowlby One';font-size:14px;min-width:58px;text-align:right;white-space:nowrap}
.kmtxt small{font-family:'Nunito';font-size:10px}
.ost{display:flex;gap:4px;flex-wrap:wrap;align-items:center;min-height:22px}
.st{font-size:11px;border-radius:999px;padding:1px 7px;border:2px solid var(--ink);white-space:nowrap;display:inline-flex;align-items:center;gap:3px}
.st.ok{background:#c9f7d6}.st.bad{background:#ffd0d0;animation:blink 1s steps(2) infinite}.st.wait{background:#fff0b3}.st.lim{background:#fff}
@keyframes blink{50%{background:#ff9d9d}}
.bchip{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;border:2px solid var(--ink);background:radial-gradient(circle at 35% 30%,#fff7c2,#ffd426 60%,#e09a00)}
.bchip.cf{box-shadow:0 0 0 2px #fff,0 0 10px 3px #ffd426}

#mine{flex:1;min-height:0;padding:8px 10px;display:flex;flex-direction:column;justify-content:center;max-width:900px;width:100%;margin:0 auto}
.me{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:8px 10px;position:relative}
.me.turn{box-shadow:0 0 0 4px var(--yel),5px 5px 0 4px var(--ink)}
.mhead{display:flex;align-items:center;gap:8px}
.mhead .nm b{font-size:16px}
.bigkm{font-family:'Bowlby One';font-size:clamp(20px,6vw,30px);color:var(--blue);white-space:nowrap}
.bigkm small{font-family:'Nunito';font-size:12px;color:#5b5980}
.me .track{height:32px}.me .car{font-size:28px}.me .flag{font-size:22px}
.piles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.pile{display:flex;flex-direction:column;align-items:center;gap:2px}
.pile label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#5b5980}
.pile .card{--cw:clamp(40px,10vw,62px)}
.slot{--cw:clamp(40px,10vw,62px);width:var(--cw);height:calc(var(--cw)*1.42);border:2px dashed #9a98b8;border-radius:calc(var(--cw)*.14);display:grid;place-items:center;font-size:calc(var(--cw)*.36);color:#9a98b8;background:#f4f4fb}
.bslots{display:grid;grid-template-columns:1fr 1fr;gap:3px;height:calc(clamp(40px,10vw,62px)*1.42);align-content:center}
.bslot{width:calc(clamp(40px,10vw,62px)*.62);height:calc(clamp(40px,10vw,62px)*.62);border-radius:50%;border:2px dashed #b6b4cf;display:grid;place-items:center;font-size:calc(clamp(40px,10vw,62px)*.32);background:#f4f4fb;opacity:.7;position:relative}
.bslot.got{border:2px solid var(--ink);opacity:1;background:radial-gradient(circle at 35% 30%,#fff7c2,#ffd426 60%,#e09a00);animation:shine 2.2s ease-in-out infinite}
.bslot.got.cf::after{content:'⚡';position:absolute;right:-5px;top:-7px;font-size:12px}
@keyframes shine{50%{box-shadow:0 0 12px 3px rgba(255,212,38,.9)}}
.deckc{--cw:clamp(40px,10vw,62px);width:var(--cw);height:calc(var(--cw)*1.42);border:2px solid var(--ink);border-radius:calc(var(--cw)*.14);background:repeating-linear-gradient(45deg,#2433f2 0 6px,#1a26c9 6px 12px);display:grid;place-items:center;box-shadow:3px 3px 0 var(--ink),5px 5px 0 #fff,7px 7px 0 var(--ink)}
.deckc span{background:var(--yel);border:2px solid var(--ink);border-radius:8px;padding:0 5px;font-family:'Bowlby One';font-size:13px}
.n200{font-size:11px}

#actbar{min-height:50px;padding:6px 10px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;color:#fff;text-align:center;flex:none}
.cinfo{font-size:13px;max-width:520px;line-height:1.25;flex:1 1 260px}
.cinfo b{color:var(--yel)}
.hintb{background:rgba(18,16,43,.55);border-radius:12px;padding:6px 12px;font-size:14px}
.myturn{color:var(--yel);font-family:'Bowlby One';font-size:15px;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.reacts{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:100%}
.reacts button{background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.35);border-radius:10px;font-size:18px;width:36px;height:34px;cursor:pointer}
.reacts button:active{transform:scale(.9)}
#hand{padding:8px 8px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:6px;background:rgba(18,16,43,.4);border-top:3px solid var(--ink);flex:none;min-height:calc(min((100vw - 60px)/7,96px)*1.42 + 24px)}
#hand .card{--cw:min(calc((100vw - 60px)/7),96px);cursor:pointer;transition:transform .15s,filter .2s,opacity .2s}
#hand.mine .card.ko{filter:saturate(.35) brightness(.85)}
#hand.mine .card.ok{box-shadow:calc(var(--cw)*.05) calc(var(--cw)*.05) 0 var(--ink),0 0 0 3px var(--green)}
#hand .card.sel{transform:translateY(-16px) scale(1.08);z-index:3;box-shadow:0 0 0 4px var(--yel),4px 6px 0 var(--ink)}
#hand.mine{animation:handglow 1.6s ease-in-out infinite}
@keyframes handglow{50%{background:rgba(255,212,38,.22)}}
@media (hover:hover){#hand .card:hover:not(.sel){transform:translateY(-6px)}}
.card.new{animation:dealin .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes dealin{from{transform:translateY(-140px) rotate(-25deg) scale(.5);opacity:0}}

/* CARDS */
.card{--cw:60px;width:var(--cw);height:calc(var(--cw)*1.42);border:max(2px,calc(var(--cw)*.04)) solid var(--ink);border-radius:calc(var(--cw)*.14);background:#fff;box-shadow:calc(var(--cw)*.05) calc(var(--cw)*.05) 0 var(--ink);display:flex;flex-direction:column;align-items:center;overflow:hidden;position:relative;flex:none}
.cband{width:100%;text-align:center;font-size:calc(var(--cw)*.13);font-weight:900;padding:calc(var(--cw)*.035) 0;color:#fff;letter-spacing:.03em;white-space:nowrap;overflow:hidden}
.k-km{background:var(--paper)}.k-km .cband{background:var(--blue)}
.k-atk{background:#ffeaea}.k-atk .cband{background:var(--red)}
.k-par{background:#e5fbea}.k-par .cband{background:var(--green)}
.k-bot{background:linear-gradient(160deg,#fff6c9,#ffd426 60%,#f5a700)}.k-bot .cband{background:var(--ink);color:var(--yel)}
.k-bot::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.75) 45%,transparent 60%);background-size:250% 100%;animation:shimmer 2.6s linear infinite;pointer-events:none}
@keyframes shimmer{from{background-position:150% 0}to{background-position:-100% 0}}
.cico{flex:1;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cw)*.44);line-height:1}
.kmv{font-family:'Bowlby One';font-size:calc(var(--cw)*.36);line-height:1;margin-top:calc(var(--cw)*.07);color:var(--blue)}
.k-km .cico{font-size:calc(var(--cw)*.3)}
.cname{font-size:calc(var(--cw)*.115);text-align:center;padding:0 2px calc(var(--cw)*.06);line-height:1.05;min-height:calc(var(--cw)*.25);display:flex;align-items:center}
.card.sm .cname{display:none}
.sign{display:inline-flex;align-items:center;justify-content:center;width:1.2em;height:1.2em;border-radius:50%;border:.15em solid var(--red);background:#fff;color:var(--ink);font-family:'Bowlby One';font-size:.75em;line-height:1;position:relative}
.sign.end{border-color:#777;color:#777}
.sign.end::after{content:'';position:absolute;left:-10%;right:-10%;top:50%;height:.1em;background:#555;transform:rotate(-45deg)}
.st .sign{font-size:10px;border-width:2px}
.hz{position:relative;display:inline-flex}
.hz::after{content:'✖';position:absolute;right:-.3em;bottom:-.2em;font-size:.55em;color:var(--red);text-shadow:0 0 2px #fff,0 0 2px #fff}
.tire{display:inline-block;width:.95em;height:.95em;border-radius:50%;border:.24em solid #222;background:radial-gradient(circle,#ddd 0 28%,#777 30% 42%,#333 44%);box-shadow:inset 0 0 0 .04em #555;vertical-align:middle}

/* LOBBY */
.code{font-family:'Bowlby One';font-size:clamp(44px,14vw,72px);letter-spacing:6px;color:var(--blue);text-align:center;line-height:1}
.plist{display:flex;flex-direction:column;gap:6px}
.pl{display:flex;align-items:center;gap:10px;background:#f4f4fb;border:2px solid var(--ink);border-radius:12px;padding:6px 10px}
.pl b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;background:var(--yel);border:2px solid var(--ink);border-radius:999px;padding:0 7px}

/* OVERLAYS */
#fxc{position:fixed;inset:0;pointer-events:none;z-index:60}
#speed{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden}
.streak{position:absolute;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95));left:0}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:70}
#vig{position:fixed;inset:0;pointer-events:none;z-index:56;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(255,30,30,.75) 100%)}
#rays{position:fixed;left:50%;top:50%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;pointer-events:none;z-index:64;opacity:0;background:repeating-conic-gradient(rgba(255,212,38,.45) 0 9deg,transparent 9deg 18deg);transition:opacity .3s}
#rays.on{opacity:1;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#banner{position:fixed;left:0;right:0;top:38%;transform:translateY(-50%);text-align:center;pointer-events:none;z-index:66;display:none;padding:0 12px}
#banner.show{display:block}
#banner .bt{font-family:'Bowlby One';font-size:clamp(38px,12vw,104px);line-height:.95;color:var(--yel);-webkit-text-stroke:3px var(--ink);text-shadow:6px 6px 0 var(--ink);animation:slam .5s cubic-bezier(.2,1.6,.4,1) both}
#banner .bs{display:inline-block;margin-top:10px;background:var(--ink);color:#fff;border-radius:12px;padding:6px 14px;font-size:clamp(14px,4vw,20px);animation:fadeup .5s .2s both}
#banner.red .bt{color:var(--red)}#banner.green .bt{color:#5dff94}#banner.white .bt{color:#fff}#banner.small .bt{font-size:clamp(30px,9vw,70px)}
#banner.cf .bt{animation:slam .5s cubic-bezier(.2,1.6,.4,1) both,jit .12s .5s linear 8}
#banner.out{animation:bannerout .35s forwards}
@keyframes slam{from{transform:scale(3.2) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(-4deg);opacity:1}}
@keyframes jit{25%{transform:translate(3px,-2px) rotate(-3deg)}75%{transform:translate(-3px,2px) rotate(-5deg)}}
@keyframes fadeup{from{transform:translateY(20px);opacity:0}}
@keyframes bannerout{to{opacity:0;transform:translateY(-50%) scale(.85)}}
.flyer{position:fixed;left:0;top:0;z-index:62;pointer-events:none}
.flyer .card{--cw:62px}
.floattxt{position:fixed;z-index:63;pointer-events:none;font-family:'Bowlby One';font-size:26px;color:var(--yel);-webkit-text-stroke:2px var(--ink);text-shadow:3px 3px 0 var(--ink);white-space:nowrap}
.react{position:fixed;z-index:63;pointer-events:none;font-size:44px}
#toast{position:fixed;left:50%;bottom:22%;transform:translateX(-50%);background:var(--ink);color:#fff;border:3px solid var(--yel);padding:8px 16px;border-radius:12px;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;max-width:90vw}
#toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(18,16,43,.6);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal.delay{animation:fadein .4s 1.5s both}
@keyframes fadein{from{opacity:0}}
.mbox{max-width:560px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;animation:popin .4s cubic-bezier(.2,1.5,.4,1) both}
.modal.delay .mbox{animation-delay:1.5s}
@keyframes popin{from{transform:scale(.6);opacity:0}}
.mbox h2{font-family:'Bowlby One';font-size:clamp(22px,6vw,32px);line-height:1.1;margin-bottom:8px}
.stbl{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.stbl th{font-size:11px;text-transform:uppercase;color:#5b5980;text-align:right;padding:4px}
.stbl td{padding:6px 4px;text-align:right;border-top:2px solid #eee}
.stbl th:first-child,.stbl td:first-child{text-align:left}
.stbl tr.win td{background:#fff3c4}
.stbl td.tot{font-family:'Bowlby One';font-size:15px}
.bonus{font-size:12px;color:#5b5980;margin:2px 0}
.trophy{font-size:72px;text-align:center;animation:wob 1.4s ease-in-out infinite}
.rules{font-size:14px;line-height:1.4;font-weight:700}
.rules p{margin:6px 0}
.rules ul{margin:4px 0 4px 18px}.rules li{margin:5px 0}.rl{display:flex;gap:10px;align-items:center;margin:7px 0}.rlc{display:flex;gap:3px;flex:none}.rules h3{margin:12px 0 4px}
.rules .mini{display:inline-flex;vertical-align:middle;margin:0 2px}
.rules .mini .card{--cw:34px}
#logd{position:fixed;top:0;right:0;bottom:0;width:min(340px,88vw);background:#fff;border-left:3px solid var(--ink);z-index:52;transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:-5px 0 0 rgba(18,16,43,.35)}
#logd.on{transform:none}
#logd header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--ink);color:var(--yel);font-family:'Bowlby One'}
#logl{overflow-y:auto;padding:8px 12px;font-size:13px;display:flex;flex-direction:column;gap:5px}
.lg{padding:5px 8px;border-radius:8px;background:#f4f4fb;border-left:5px solid #bbb}

<script>
'use strict';
/* ============ UTILITAIRES ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const rnd=n=>Math.floor(Math.random()*n);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ============ CARTES ============ */
const TIRE='<span class="tire"></span>';
const DEF={
  '25':{k:'km',v:25,n:'25 km',ic:'🐌'},
  '50':{k:'km',v:50,n:'50 km',ic:'🦆'},
  '75':{k:'km',v:75,n:'75 km',ic:'🦋'},
  '100':{k:'km',v:100,n:'100 km',ic:'🐇'},
  '200':{k:'km',v:200,n:'200 km',ic:'🦅'},
  FR:{k:'atk',n:'Feu rouge',ic:'🛑',par:'FV',bot:'BP'},
  LV:{k:'atk',n:'Limitation de vitesse',ic:'<span class="sign">50</span>',par:'FL',bot:'BP'},
  PE:{k:'atk',n:"Panne d'essence",ic:'<span class="hz">⛽</span>',par:'ES',bot:'BC'},
  CR:{k:'atk',n:'Crevaison',ic:'<span class="hz">'+TIRE+'</span>',par:'RS',bot:'BI'},
  AC:{k:'atk',n:'Accident',ic:'💥',par:'RE',bot:'BA'},
  FV:{k:'par',n:'Feu vert',ic:'🟢',vs:'FR'},
  FL:{k:'par',n:'Fin de limitation',ic:'<span class="sign end">50</span>',vs:'LV'},
  ES:{k:'par',n:'Essence',ic:'⛽',vs:'PE'},
  RS:{k:'par',n:'Roue de secours',ic:TIRE,vs:'CR'},
  RE:{k:'par',n:'Réparations',ic:'🔧',vs:'AC'},
  BP:{k:'bot',n:'Véhicule prioritaire',ic:'🚑',vs:['FR','LV']},
  BC:{k:'bot',n:"Citerne d'essence",ic:'🛢️',vs:['PE']},
  BI:{k:'bot',n:'Increvable',ic:'🛡️',vs:['CR']},
  BA:{k:'bot',n:'As du volant',ic:'🏁',vs:['AC']},
};
const COUNTS={'25':10,'50':10,'75':10,'100':12,'200':4,FR:5,LV:4,PE:3,CR:3,AC:3,FV:14,FL:6,ES:6,RS:6,RE:6,BP:1,BC:1,BI:1,BA:1};
const BAND={km:'BORNES',atk:'ATTAQUE',par:'PARADE',bot:'BOTTE'};
const HAZ=['FR','PE','CR','AC'];
const DESC={
  km:c=>`Avance de <b>${DEF[c].v} km</b>. Il faut rouler (feu vert).${c==='200'?' Max <b>2</b> cartes 200 par manche.':''}${+c>50?' Interdit si tu es limité à 50.':''}`,
  FR:'Pose-le sur un adversaire qui roule : il est bloqué jusqu’à son prochain <b>feu vert</b>.',
  LV:'L’adversaire ne pourra plus poser que des <b>25 ou 50 km</b> jusqu’à une fin de limitation.',
  PE:'Panne sèche ! L’adversaire doit poser <b>Essence</b> puis un <b>feu vert</b>.',
  CR:'Pneu crevé ! L’adversaire doit poser une <b>Roue de secours</b> puis un <b>feu vert</b>.',
  AC:'Boum ! L’adversaire doit poser <b>Réparations</b> puis un <b>feu vert</b>.',
  FV:'Te permet de <b>rouler</b> : au départ, après un feu rouge ou après une réparation.',
  FL:'Annule la <b>limitation de vitesse</b> qui te freine.',
  ES:'Répare une <b>panne d’essence</b>. Ensuite, il te faudra un feu vert.',
  RS:'Répare une <b>crevaison</b>. Ensuite, il te faudra un feu vert.',
  RE:'Répare un <b>accident</b>. Ensuite, il te faudra un feu vert.',
  BP:'Protection à vie contre <b>feux rouges et limitations</b>, et tu roules <b>sans feu vert</b> ! +100 pts et tu <b>rejoues</b>.',
  BC:'Protection à vie contre les <b>pannes d’essence</b>. +100 pts et tu <b>rejoues</b>.',
  BI:'Protection à vie contre les <b>crevaisons</b>. +100 pts et tu <b>rejoues</b>.',
  BA:'Protection à vie contre les <b>accidents</b>. +100 pts et tu <b>rejoues</b>.',
};
const CF_TIP=' 💡 Garde-la en main : si on t’attaque avec ce qu’elle contre, <b>COUP FOURRÉ</b> automatique (+300) !';
const CARS=['🏎️','🚙','🚕','🚓'];
const BOTNAMES=['Robo-Ginette','Turbo Bernard','Jean-Mi 2CV','Mamie Nitro','Kevin Tuning','Dédé la Bielle','Gégé Diesel','Josiane Rallye'];
const COLORS=['#e8467c','#f28c28','#1fbf5b','#7a4dff','#00a3c4','#d4a20a','#e84a3a','#4a6cff'];

/* ============ MOTEUR ============ */
const hasB=(p,b)=>p.bottes.some(x=>x.c===b);
const isHaz=c=>HAZ.includes(c);
const rolling=p=>hasB(p,'BP')?!isHaz(p.battle):p.battle==='FV';
const limited=p=>p.limit&&!hasB(p,'BP');

function buildDeck(){const d=[];for(const c in COUNTS)for(let i=0;i<COUNTS[c];i++)d.push(c);for(let i=d.length-1;i>0;i--){const j=rnd(i+1);[d[i],d[j]]=[d[j],d[i]]}return d}
function log(s,t,k){s.log.push({t,k:k||''});if(s.log.length>30)s.log.shift()}
const MAX_RESHUF=40;
function refill(s){
  const pool=s.discard.concat(s.used||[]);
  if(s.deck.length||!pool.length||(s.reshuf||0)>=MAX_RESHUF)return false;
  const d=pool;s.used=[];for(let i=d.length-1;i>0;i--){const j=rnd(i+1);[d[i],d[j]]=[d[j],d[i]]}
  s.deck=d;s.discard=[];s.reshuf=(s.reshuf||0)+1;
  log(s,`🔄 Pioche vide : la défausse est remélangée (${d.length} cartes)`,'big');s.fx.push({e:'shuffle',n:d.length});return true;
}
function draw(s,i){if(!s.deck.length)refill(s);if(s.deck.length){s.seats[i].hand.push(s.deck.pop());return true}return false}

function canSelf(s,i,c){
  const p=s.seats[i],d=DEF[c];
  if(d.k==='km')return rolling(p)&&p.km+d.v<=1000&&!(d.v===200&&p.n200>=2)&&!(limited(p)&&d.v>50);
  if(d.k==='par'){
    if(c==='FV')return !hasB(p,'BP')&&p.battle!=='FV'&&!(isHaz(p.battle)&&p.battle!=='FR');
    if(c==='FL')return limited(p);
    return p.battle===d.vs;
  }
  return d.k==='bot';
}
function targets(s,i,c){
  const d=DEF[c];if(!d||d.k!=='atk')return [];
  const r=[];
  s.seats.forEach((t,j)=>{
    if(j===i)return;
    if(c==='LV'){if(!t.limit&&!hasB(t,'BP'))r.push(j);return}
    if(!hasB(t,d.bot)&&rolling(t))r.push(j);
  });
  return r;
}
function playable(s,i,c){return DEF[c].k==='atk'?targets(s,i,c).length>0:canSelf(s,i,c)}
function applyBotte(s,p,b){
  const dis=s.discard||[];
  if(b==='BP'){if(p.limit){p.limit=false;dis.push('LV')}if(p.battle==='FR'){dis.push('FR');p.battle=null}}
  else{const hz={BC:'PE',BI:'CR',BA:'AC'}[b];if(p.battle===hz){dis.push(hz);p.battle=null}}
}
function advanceTurn(s,idx){
  const n=s.seats.length;
  for(let k=0;k<n;k++){
    const j=(idx+k)%n;
    if(draw(s,j)){s.turn=j;return}
    if(s.seats[j].hand.length){s.turn=j;return}
  }
  log(s,'🂠 Plus aucune carte : fin de la manche !','big');
  endRound(s,-1);
}
function doAction(s,i,a){
  if(s.phase!=='play'||s.turn!==i)return false;
  const n=s.seats.length,p=s.seats[i],c=p.hand[a.idx];
  if(c==null)return false;
  const d=DEF[c];
  if(a.type==='discard'){
    p.hand.splice(a.idx,1);s.discard.push(c);
    log(s,`${p.name} défausse ${d.n}`,'disc');s.fx.push({e:'disc',p:i,c});
    advanceTurn(s,(i+1)%n);return true;
  }
  if(d.k==='atk'){
    const t=a.target;
    if(!targets(s,i,c).includes(t))return false;
    p.hand.splice(a.idx,1);
    const T=s.seats[t],b=d.bot,bi=T.hand.indexOf(b);
    if(bi>=0){
      T.hand.splice(bi,1);T.bottes.push({c:b,cf:1});s.discard.push(c);applyBotte(s,T,b);draw(s,t);
      log(s,`⚡ COUP FOURRÉ de ${T.name} ! ${p.name} tente ${d.n}, contré par ${DEF[b].n} (+400)`,'cf');
      s.fx.push({e:'cf',p:t,by:i,a:c,c:b,all4:T.bottes.length===4});
      advanceTurn(s,t);
    }else{
      if(c==='LV')T.limit=true;else{if(T.battle)s.discard.push(T.battle);T.battle=c}
      log(s,`${p.name} → ${d.n} sur ${T.name}`,'atk');
      s.fx.push({e:'atk',p:i,t,c});
      advanceTurn(s,(i+1)%n);
    }
    return true;
  }
  if(!canSelf(s,i,c))return false;
  p.hand.splice(a.idx,1);
  if(d.k==='km'){
    const before=p.km;p.km+=d.v;(s.used=s.used||[]).push(c);if(d.v===200)p.n200++;
    log(s,`${p.name} roule ${d.v} km (${p.km} km)`,'km');
    s.fx.push({e:'km',p:i,c,v:d.v,from:before,km:p.km});
    if(p.km===1000){
      s.delayed=s.deck.length===0;
      log(s,`🏁 ${p.name} atteint les 1000 BORNES !`,'big');
      s.fx.push({e:'win1000',p:i});
      endRound(s,i);
    }else advanceTurn(s,(i+1)%n);
  }else if(d.k==='par'){
    if(c==='FL'){p.limit=false;s.discard.push('LV','FL')}else{if(p.battle)s.discard.push(p.battle);p.battle=c}
    log(s,`${p.name} pose ${d.n}`,'par');s.fx.push({e:'par',p:i,c});
    advanceTurn(s,(i+1)%n);
  }else{
    p.bottes.push({c,cf:0});applyBotte(s,p,c);
    log(s,`✨ ${p.name} pose la botte ${d.n} et rejoue`,'bot');
    s.fx.push({e:'bot',p:i,c,all4:p.bottes.length===4});
    advanceTurn(s,i);
  }
  return true;
}
function endRound(s,wi){
  const res=s.seats.map((p,j)=>{
    const nb=p.bottes.length,ncf=p.bottes.filter(b=>b.cf).length;
    const r={km:p.km,bottes:nb*100,cf:ncf*300,all4:nb===4?300:0,trip:0,delayed:0,safe:0,shutout:0};
    if(p.km===1000){
      r.trip=400;if(s.delayed)r.delayed=300;if(p.n200===0)r.safe=300;
      if(s.seats.every((q,k)=>k===j||q.km===0))r.shutout=500;
    }
    r.pts=r.km+r.bottes+r.cf+r.all4+r.trip+r.delayed+r.safe+r.shutout;
    p.total+=r.pts;return r;
  });
  s.roundRes=res;s.roundWinner=wi;
  const max=Math.max(...s.seats.map(p=>p.total));
  if(!s.target||max>=s.target){s.phase='over';s.winners=s.seats.map((p,j)=>p.total===max?j:-1).filter(j=>j>=0)}
  else s.phase='roundEnd';
}
function newRound(s){
  s.round++;s.deck=buildDeck();s.discard=[];s.used=[];s.reshuf=0;s.delayed=false;s.roundRes=null;s.roundWinner=-1;
  s.seats.forEach(p=>Object.assign(p,{hand:[],battle:null,limit:false,km:0,n200:0,bottes:[]}));
  for(let r=0;r<6;r++)s.seats.forEach((p,j)=>draw(s,j));
  s.phase='play';
  log(s,`🚦 Manche ${s.round} : tout le monde attend son feu vert !`,'big');
  s.fx.push({e:'round'});
  advanceTurn(s,(s.round-1)%s.seats.length);
}
function newGame(seats,o){
  const s={v:0,h:'',phase:'play',mode:o.mode,room:o.room||null,gameId:o.gameId,target:o.target||0,round:0,
    seats:seats.map((x,j)=>({id:x.id,name:x.name,bot:!!x.bot,car:CARS[j%4],total:0,hand:[],battle:null,limit:false,km:0,n200:0,bottes:[]})),
    deck:[],discard:[],turn:0,log:[],fx:[],winners:[]};
  newRound(s);return s;
}

/* ============ BOTS ============ */
function botteHelps(p,b){const q=clone(p);q.bottes.push({c:b});applyBotte({},q,b);return (!rolling(p)&&rolling(q))||(limited(p)&&!limited(q))}
function keepValue(s,i,c,H){
  const p=s.seats[i],d=DEF[c];
  if(d.k==='bot')return 1000;
  if(d.k==='km'){if(p.km+d.v>1000)return 0;if(d.v===200&&p.n200>=2)return 0;if(limited(p)&&d.v>50)return 30+d.v/10;return 40+d.v/5}
  if(d.k==='par'){
    const prot=c==='FV'||c==='FL'?'BP':DEF[d.vs].bot;
    if(hasB(p,prot))return 1;
    if(c==='FV'?canSelf(s,i,c):p.battle===d.vs)return 200;
    const dup=H.filter(x=>x===c).length;
    return c==='FV'?(dup>2?25:95):(dup>1?18:85);
  }
  return 45;
}
function botChoose(s,i){
  const p=s.seats[i],H=p.hand;
  const P=k=>({type:'play',idx:k});
  for(let k=0;k<H.length;k++)if(DEF[H[k]].k==='bot'&&botteHelps(p,H[k]))return P(k);
  if(s.deck.length<8&&(s.reshuf||0)>=MAX_RESHUF){const k=H.findIndex(c=>DEF[c].k==='bot');if(k>=0)return P(k)}
  if(!rolling(p)){const k=H.findIndex(c=>DEF[c].k==='par'&&c!=='FL'&&canSelf(s,i,c));if(k>=0)return P(k)}
  let best=null;
  const lead=Math.max(...s.seats.map((q,j)=>j===i?-1:q.km));
  H.forEach((c,k)=>{if(DEF[c].k!=='atk')return;targets(s,i,c).forEach(t=>{
    const T=s.seats[t];let sc=T.km+T.total/20+(c==='LV'?(T.km>=850?-400:-120):0)+(T.km>=700?250:0)+(T.km<lead?-200:0)+(T.km<p.km-200?-300:0)+Math.random()*30;
    if(!best||sc>best.sc)best={sc,k,t};
  })});
  if(best&&best.sc>=520)return {type:'play',idx:best.k,target:best.t};
  const kms=H.map((c,k)=>({c,k})).filter(o=>DEF[o.c].k==='km'&&canSelf(s,i,o.c));
  if(kms.length){
    const ex=kms.find(o=>p.km+DEF[o.c].v===1000);if(ex)return P(ex.k);
    kms.sort((a,b)=>DEF[b.c].v-DEF[a.c].v);return P(kms[0].k);
  }
  if(best&&best.sc>=250)return {type:'play',idx:best.k,target:best.t};
  let k=H.findIndex(c=>c==='FL'&&canSelf(s,i,c));if(k>=0)return P(k);
  k=H.findIndex(c=>DEF[c].k==='par'&&canSelf(s,i,c));if(k>=0)return P(k);
  if(H.every(c=>DEF[c].k==='bot'))return P(0);
  let w=0,wv=1e9;H.forEach((c,j)=>{const v=keepValue(s,i,c,H)+Math.random();if(v<wv){wv=v;w=j}});
  return {type:'discard',idx:w};
}

/* ============ SON ============ */
const A={ctx:null,on:LS.get('mb_snd',true),master:null,nb:null};
function actx(){
  if(!A.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{A.ctx=new C();A.master=A.ctx.createGain();A.master.gain.value=.55;A.master.connect(A.ctx.destination)}catch(e){return null}}
  if(A.ctx.state==='suspended')A.ctx.resume();return A.ctx;
}
function tone(f,d,o={}){
  if(!A.on)return;const c=actx();if(!c)return;
  const t=c.currentTime+(o.delay||0),os=c.createOscillator(),g=c.createGain();
  os.type=o.type||'square';os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+d);
  const v=o.vol==null?.12:o.vol;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.att||.01));g.gain.exponentialRampToValueAtTime(.0001,t+d);
  let node=os;if(o.lp){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;os.connect(fl);node=fl}
  node.connect(g);g.connect(A.master);os.start(t);os.stop(t+d+.05);
}
function noise(d,o={}){
  if(!A.on)return;const c=actx();if(!c)return;
  if(!A.nb){A.nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate);const a=A.nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
  const t=c.currentTime+(o.delay||0),src=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();
  src.buffer=A.nb;src.loop=true;fl.type=o.ft||'lowpass';fl.frequency.setValueAtTime(o.f||1000,t);if(o.fto)fl.frequency.exponentialRampToValueAtTime(o.fto,t+d);
  const v=o.vol==null?.2:o.vol;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.att||.01));g.gain.exponentialRampToValueAtTime(.0001,t+d);
  src.connect(fl);fl.connect(g);g.connect(A.master);src.start(t);src.stop(t+d+.05);
}
const SFX={
  click(){tone(820,.04,{vol:.04})},
  vroom(){tone(70,.75,{type:'sawtooth',to:190,vol:.2,lp:900});tone(140,.55,{type:'square',to:320,vol:.05,lp:1400,delay:.05})},
  zoom(){tone(110,1,{type:'sawtooth',to:700,vol:.2,lp:2400});noise(.9,{ft:'bandpass',f:600,fto:5000,vol:.3})},
  whoosh(){noise(.3,{ft:'bandpass',f:1800,fto:300,vol:.15})},
  launch(){tone(520,.2,{to:180,vol:.07})},
  boom(){noise(1.5,{ft:'lowpass',f:1200,fto:60,vol:.8});tone(90,1,{type:'sine',to:28,vol:.6})},
  hiss(){tone(260,.05,{vol:.15});noise(1.2,{ft:'highpass',f:2500,vol:.3,delay:.04})},
  sputter(){for(let k=0;k<6;k++){noise(.08,{f:500,vol:.45,delay:k*.14});tone(55,.08,{delay:k*.14,vol:.1})}tone(80,.7,{type:'sawtooth',to:30,vol:.13,delay:.9,lp:400})},
  brake(){tone(1700,.7,{type:'sawtooth',to:1250,vol:.05,lp:3200});noise(.7,{ft:'bandpass',f:2600,vol:.18})},
  limit(){tone(330,.12,{vol:.1});tone(330,.12,{vol:.1,delay:.17});noise(.2,{f:300,vol:.4,delay:.34})},
  ding(){tone(988,.16,{type:'triangle',vol:.2});tone(1319,.4,{type:'triangle',vol:.2,delay:.1})},
  botte(){[523,659,784,1047,1319].forEach((f,k)=>tone(f,.5,{type:'triangle',vol:.15,delay:k*.07}));tone(2093,.8,{type:'sine',vol:.06,delay:.35})},
  cf(){noise(.35,{f:4000,vol:.55});tone(110,1.4,{type:'sawtooth',to:55,vol:.2,lp:800});

const FX={cv:null,cx:null,parts:[],run:false,dpr:1};
function fxInit(){FX.cv=$('#fxc');FX.cx=FX.cv.getContext('2d');const rs=()=>{FX.dpr=Math.min(2,window.devicePixelRatio||1);FX.cv.width=innerWidth*FX.dpr;FX.cv.height=innerHeight*FX.dpr;FX.cv.style.width=innerWidth+'px';FX.cv.style.height=innerHeight+'px'};rs();addEventListener('resize',rs)}
function addP(p){if(FX.parts.length>900)return;FX.parts.push(p);if(!FX.run){FX.run=true;requestAnimationFrame(fxLoop)}}
function fxLoop(){
  const c=FX.cx,d=FX.dpr;c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,innerWidth,innerHeight);
  FX.parts=FX.parts.filter(p=>{
    p.vy+=p.g;p.vx*=p.dr;p.vy*=p.dr;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;p.s+=p.gs||0;
    if(p.life<=0||p.s<=0)return false;
    const a=Math.min(1,p.life/p.fade);c.globalAlpha=a*(p.a||1);c.save();c.translate(p.x,p.y);c.rotate(p.r);
    if(p.sh==='rect'){c.fillStyle=p.c;c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2)}
    else if(p.sh==='txt'){c.font=`${p.s}px serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(p.t,0,0)}
    else{c.fillStyle=p.c;c.beginPath();c.arc(0,0,p.s,0,7);c.fill()}
    c.restore();return true;
  });
  c.globalAlpha=1;
  if(FX.parts.length)requestAnimationFrame(fxLoop);else{FX.run=false;c.clearRect(0,0,innerWidth,innerHeight)}
}
function burst(x,y,o={}){
  const n=o.n||30,cols=o.cols||['#ffd426','#ff4545','#fff'];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=(o.sp||6)*(.3+Math.random());
    addP({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(o.up||0),g:o.g==null?.15:o.g,dr:o.dr||.97,r:Math.random()*6,vr:(Math.random()-.5)*.3,life:(o.life||60)*(.6+Math.random()*.6),fade:20,s:(o.s||6)*(.6+Math.random()*.8),gs:o.gs,sh:o.sh||'rect',c:cols[rnd(cols.length)],t:o.t,a:o.a});}
}

/* ============ BOTS / AUTO-JEU ============ */
let botT=null,botKey=null;
function scheduleBots(){
  if(!S||S.phase!=='play'||!S.seats)return;
  const p=S.seats[S.turn];let delay=null;
  if(MODE==='solo'){if(p.bot)delay=1000+Math.random()*700}
  else if(amHost()){if(p.bot)delay=1150+Math.random()*700;else if(!present(p.id))delay=12000}
  if(delay==null)return;
  const key=S.v+':'+S.h;if(botKey===key)return;botKey=key;clearTimeout(botT);
  botT=setTimeout(()=>{
    if(!S||S.v+':'+S.h!==key||S.phase!=='play')return;
    const i=S.turn,q=S.seats[i];
    if(MODE==='online'&&(!amHost()||(!q.bot&&present(q.id)))){botKey=null;return}
    const ns=clone(S);ns.fx=[];
    if(!doAction(ns,i,botChoose(ns,i))){const ns2=clone(S);ns2.fx=[];doAction(ns2,i,{type:'discard',idx:0});commit(ns2);return}
    commit(ns);
  },delay);
}

  const mi=myIdx();if(!S||mi<0||S.phase!=='play'||S.turn!==mi)return;

function checkFin(){
  if(!S||S.phase!=='over'||MODE!=='online')return;

}

function sendAv(){if(ON.salle&&ME&&ME.avatar){try{ON.salle.send({t:'av',a:ME.avatar})}catch(e){}}}
function joinRoom(code,create){
  const cg=CG();if(!cg){toast('Le mode en ligne marche depuis le hub ChadGangGames');return}
  code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12);
  if(code.length<4){toast('Code de salle : 4 lettres minimum');return}
  leaveRoom();MODE='online';S=null;SEL=null;ON.code=code;lastEndKey=null;
  show('lobby');renderLobby();
  let salle;try{salle=cg.join(code,{create})}catch(e){toast('Impossible de rejoindre 😬');goHome();return}
  ON.salle=salle;
  salle.on('ready',info=>{
    if(ON.salle!==salle)return;
    MYID=info.me;ON.players=info.players||[];sendAv();
    const last=info.last;
    if(last&&last.t==='state'&&last.s&&newer(last.s))setState(last.s,false);
    else if(!S)commit({phase:'lobby',target:HOME.target,bots:0,fx:[]});
    route();
  });
  salle.on('players',list=>{if(ON.salle!==salle)return;ON.players=list||[];sendAv();route();scheduleBots()});
  salle.on('message',(data,from)=>{
    if(ON.salle!==salle||!data)return;
    if(data.t==='state'&&data.s){if(newer(data.s))setState(data.s,true)}
    else if(data.t==='av'&&from){if(AVS[from.id]!==data.a){AVS[from.id]=data.a;route()}}
    else if(data.t==='react'&&from)showReact(from.id,data.e);
  });
  salle.on('error',msg=>{toast('😬 '+esc(msg||'Problème avec la salle'),3500);if(!S)goHome()});
}

function startOnline(keepBots){
  const humans=ON.players.slice(0,4).map(p=>({id:p.id,name:p.name}));

  const nb=Math.min(want,4-humans.length);

  ${rl(['FL'],'<b>Fin de limitation</b> : annule la limitation de vitesse.')}
  <h3>✨ Les 4 bottes</h3>
  <p>Une seule de chaque dans le jeu. Une botte te protège <b>à vie</b> pour toute la manche, rapporte <b>+100 pts</b> et te fait <b>rejouer</b> aussitôt. Si tu es bloqué par ce qu’elle contre, elle te répare aussi.</p>
  ${rl(['BP'],'<b>Véhicule prioritaire</b> : immunisé contre les <b>feux rouges</b> et les <b>limitations de vitesse</b>. Tu roules <b>sans feu vert</b> !')}
  ${rl(['BC'],'<b>Citerne d’essence</b> : immunisé contre les <b>pannes d’essence</b>.')}
  ${rl(['BI'],'<b>Increvable</b> : immunisé contre les <b>crevaisons</b>.')}
  ${rl(['BA'],'<b>As du volant</b> : immunisé contre les <b>accidents</b>.')}
  <p>⚡ <b>Coup fourré</b> : si on t’attaque et que tu as en main la botte qui contre cette attaque, elle se déclenche <b>automatiquement</b> : l’attaque est annulée, tu gagnes +400 pts (100 + 300) et c’est à toi de jouer !</p>
  <h3>🏆 Points de la manche</h3><ul><li>1 point par km parcouru</li><li>Botte +100 · Coup fourré +300 · Les 4 bottes +300</li><li>Voyage terminé (1000 km) +400</li><li>Sans carte 200 +300</li><li>Capot (tous les adversaires à 0 km) +500</li></ul>
  <div style="text-align:center;margin-top:10px"><button class="btn" data-act="closerules">C’est parti !</button></div></div>`;
  $('#rulem').classList.add('on');
}

/* ============ ÉVÉNEMENTS ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;actx();
  if(act==='noop')return;
  if(act!=='card')SFX.click();
  switch(act){
    case 'card':{const k=+el.dataset.i;const mi=myIdx();SEL=SEL===k?null:k;tone(SEL==null?500:700,.05,{vol:.05});
      if(SEL!=null&&mi>=0&&S.turn===mi&&S.phase==='play'){const c=S.seats[mi].hand[SEL];if(DEF[c].k==='atk'&&targets(S,mi,c).length)toast('🎯 Choisis ta victime',1200)}
      renderGame();break}
    case 'play':if(SEL!=null)myAction({type:'play',idx:SEL});break;
    case 'atk':if(SEL!=null)myAction({type:'play',idx:SEL,target:+el.dataset.t});break;
    case 'discard':if(SEL!=null)myAction({type:'discard',idx:SEL});break;
    case 'log':$('#logd').classList.toggle('on');renderLog();break;
    case 'snd':A.on=!A.on;LS.set('mb_snd',A.on);$$('.sndb').forEach(b=>b.textContent=A.on?'🔊':'🔇');if(A.on)SFX.ding();break;
    case 'rules':showRules();break;
    case 'closerules':if(e.target===el||el.tagName==='BUTTON')$('#rulem').classList.remove('on');break;
    case 'quit':if(MODE==='online'&&S&&S.phase==='play'&&myIdx()>=0&&!confirmQuit())break;goHome();break;
    case 'home':goHome();break;
    case 'react':if(ON.salle){if(Date.now()-reactAt<1200){toast('Doucement le spam 😅',900);break}reactAt=Date.now();try{ON.salle.send({t:'react',e:el.dataset.e})}catch(_){}}break;
    case 'create':joinRoom(genCode(),true);break;
    case 'join':{const v=($('#code')||{}).value||'';joinRoom(v,false);break}
    case 'h-bots':HOME.bots=+el.dataset.v;LS.set('mb_bots',HOME.bots);renderHome();break;
    case 'h-target':HOME.target=+el.dataset.v;LS.set('mb_target',HOME.target);renderHome();break;
    case 'solo':startSolo();break;
    case 'resume':resumeSolo();break;
    case 'lb-target':if(amHost()){const ns=clone(S);ns.fx=[];ns.target=+el.dataset.v;commit(ns)}break;
    case 'lb-bots':if(amHost()){const ns=clone(S);ns.fx=[];const maxB=Math.max(0,4-Math.min(4,ON.players.length));ns.bots=Math.max(0,Math.min(maxB,Math.min(ns.bots||0,maxB)+(+el.dataset.d)));commit(ns)}break;
    case 'start':if(amHost())startOnline();break;
    case 'next':if(amHost()&&S.phase==='roundEnd'){const ns=clone(S);ns.fx=[];newRound(ns);lastEndKey=null;commit(ns)}break;
    case 'rematch':if(!amHost())break;lastEndKey=null;
      if(MODE==='solo'){const ns=newGame(S.seats.map(p=>({id:p.id,name:p.name,bot:p.bot})),{mode:'solo',target:S.target,gameId:'solo-'+Date.now().toString(36)});commit(ns)}
      else{const tgt=S.target,nb=S.seats.filter(p=>p.bot).length;S.target=tgt;startOnline(nb)}
      break;
    case 'tolobby':if(amHost()){commit({phase:'lobby',target:S.target||0,bots:S.seats?S.seats.filter(p=>p.bot).length:0,fx:[]})}break;
  }
});
let quitArm=0;
function confirmQuit(){if(Date.now()-quitArm<3000)return true;quitArm=Date.now();toast('Re-clique sur 🚪 pour quitter la partie',2500);return false}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#rulem').classList.contains('on'))$('#rulem').classList.remove('on');else if(SEL!=null){SEL=null;renderGame()}}
  if(e.key==='Enter'&&e.target&&e.target.id==='code'){joinRoom(e.target.value,false)}
  const mi=myIdx();
  if(S&&S.phase==='play'&&mi>=0&&S.turn===mi&&/^[1-7]$/.test(e.key)&&!(e.target&&e.target.tagName==='INPUT')){const k=+e.key-1;if(k<S.seats[mi].hand.length){SEL=SEL===k?null:k;renderGame()}}
});

/* ============ DÉMARRAGE ============ */
async function boot(){
  fxInit();
  const cg=CG();
  if(cg&&cg.me){try{ME=await cg.me()}catch(e){ME=null}}
  if(ME&&ME.avatar)AVS[ME.id]=ME.avatar;
  renderHome();
  let code=null;try{code=cg&&cg.room?cg.room():null}catch(e){}
  if(code)joinRoom(code,true);
}
window.__mb={get S(){return S},botChoose,doAction,myAction,myIdx,DEF};
boot();
</script>
</body>
